<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Icono P minimalista -->
  <g transform="translate(40, 60)">
    <rect x="-3" y="-35" width="6" height="70" fill="url(#logoGrad)" rx="3"/>
    <circle cx="0" cy="-20" r="16" fill="none" stroke="url(#logoGrad)" stroke-width="6"/>
    <circle cx="0" cy="-20" r="4" fill="#F59E0B"/>

    <!-- Líneas de velocidad -->
    <line x1="20" y1="-20" x2="30" y2="-20" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="22" y1="-14" x2="28" y2="-14" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="22" y1="-26" x2="28" y2="-26" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Texto PADEL EMPIRE -->
  <text x="100" y="65" font-family="'Poppins', 'Arial', sans-serif" font-size="48" font-weight="900" letter-spacing="-2" fill="#0F172A">
    PADEL
  </text>

  <text x="100" y="95" font-family="'Poppins', 'Arial', sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="url(#logoGrad)">
    EMPIRE
  </text>
</svg>