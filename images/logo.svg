<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Forma P estilizada + pala -->
  <g transform="translate(100, 100)">
    <!-- Línea vertical (P y mango) -->
    <rect x="-4" y="-60" width="8" height="120" fill="url(#grad1)" rx="4"/>

    <!-- Círculo superior (parte de P y cabeza de pala) -->
    <circle cx="0" cy="-35" r="28" fill="none" stroke="url(#grad1)" stroke-width="8"/>

    <!-- Detalle minimalista - punto de impacto -->
    <circle cx="0" cy="-35" r="6" fill="#F59E0B"/>

    <!-- Líneas de velocidad/movimiento -->
    <line x1="35" y1="-35" x2="50" y2="-35" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="38" y1="-25" x2="48" y2="-25" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="38" y1="-45" x2="48" y2="-45" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>